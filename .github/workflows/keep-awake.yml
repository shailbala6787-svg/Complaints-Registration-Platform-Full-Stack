name: Keep Render Backend Awake

on:
  schedule:
    - cron: '*/10 * * * *' # Runs every 10 minutes (Render sleeps after 15 mins of inactivity)
  workflow_dispatch:      # Allows manual trigger in GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Endpoint
        run: |
          echo "Sending keep-alive ping to Render backend..."
          curl -f -s https://complaints-registration-platform-full-aoil.onrender.com/ || echo "Ping failed, server might be starting up"
          echo "Ping finished at $(date)"
